server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/manifest+json
        image/svg+xml;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Vite emits content-hashed filenames under /assets, so they never change.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Traefik routes /api straight to the backend, so nothing under it should
    # ever land here. Fail loudly instead of letting the SPA fallback answer an
    # API call with HTML, which would surface as a confusing Zod parse error.
    location /api/ {
        add_header Content-Type application/json always;
        return 404 "{\"detail\":\"/api is not served by the frontend; check the Traefik route\"}";
    }

    # SPA fallback: TanStack Router owns every non-asset path.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
