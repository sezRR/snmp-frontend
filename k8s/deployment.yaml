apiVersion: apps/v1
kind: Deployment
metadata:
  name: snmp-frontend
  labels:
    app.kubernetes.io/name: snmp-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: snmp-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: snmp-frontend
    spec:
      containers:
        - name: nginx
          # Overridden by the `images:` entry in kustomization.yaml.
          image: snmp-frontend:0.0.1
          ports:
            - name: http
              containerPort: 80
          # The image is a static file server: no config, no secrets, no env.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              # The minimum the stock nginx image needs: bind :80, chown its
              # cache dirs at startup, and drop workers to the nginx user.
              add: ["NET_BIND_SERVICE", "CHOWN", "SETUID", "SETGID"]
          volumeMounts:
            # Writable paths the nginx entrypoint and workers need once the
            # root filesystem is read-only.
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
