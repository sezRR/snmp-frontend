apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The backend Service (`fastapi`, port 80) is expected to already exist in this
# namespace; the IngressRoute only routes to it.
# namespace: snmp

resources:
  - deployment.yaml
  - service.yaml
  - ingressroute.yaml

images:
  - name: snmp-frontend
    newName: snmp-frontend
    newTag: 1.0.1

labels:
  - pairs:
      app.kubernetes.io/part-of: snmp
    includeSelectors: false
